<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC DIGITAL HR - Employee Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
            --primary-dark: #6D28D9;
            --primary-light: #7C3AED;
            --secondary: #4F46E5;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #3B82F6;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F9FAFB;
            --bg-tertiary: #F3F4F6;
            --border: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .sora-font {
            font-family: 'Sora', sans-serif;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* LAYOUT */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--primary-gradient);
            color: white;
            padding: 24px 0;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 0 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-brand h1 {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }

        .sidebar-nav {
            list-style: none;
            padding: 16px 0;
        }

        .sidebar-nav li {
            margin: 0;
        }

        .sidebar-nav button {
            width: 100%;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 24px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
        }

        .sidebar-nav button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .sidebar-nav button.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border-right: 3px solid white;
        }

        .sidebar-nav button svg {
            width: 20px;
            height: 20px;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-footer button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s ease;
        }

        .sidebar-footer button:hover {
            color: white;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            height: 70px;
        }

        .topbar-title {
            font-size: 24px;
            font-weight: 600;
            font-family: 'Sora', sans-serif;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* SECTIONS */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* LOGIN PAGE */
        .login-container {
            display: flex;
            height: 100vh;
            background: white;
        }

        .login-left {
            flex: 1;
            background: var(--primary-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 48px 32px;
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
        }

        .login-left::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -100px;
        }

        .login-left-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .login-left-logo {
            font-size: 48px;
            margin-bottom: 24px;
        }

        .login-left h1 {
            font-size: 36px;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            margin-bottom: 12px;
        }

        .login-left p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .login-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .login-form p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        .btn-danger {
            background: #FEE2E2;
            color: #DC2626;
        }

        .btn-danger:hover {
            background: #FCA5A5;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-icon {
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
        }

        /* STAT CARDS */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            opacity: 0.1;
        }

        .stat-card.blue::before {
            background: #3B82F6;
        }

        .stat-card.green::before {
            background: #10B981;
        }

        .stat-card.orange::before {
            background: #F59E0B;
        }

        .stat-card.pink::before {
            background: #EC4899;
        }

        .stat-card.cyan::before {
            background: #06B6D4;
        }

        .stat-card-content {
            position: relative;
            z-index: 2;
        }

        .stat-card-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Sora', sans-serif;
        }

        .stat-card-change {
            font-size: 12px;
            margin-top: 8px;
            color: var(--success);
        }

        /* PANELS */
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            font-family: 'Sora', sans-serif;
            color: var(--text-primary);
        }

        .panel-chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 16px;
        }

        /* TOOLBAR */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
        }

        .search-input input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .search-input input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        /* DATA TABLE */
        .table-container {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
        }

        .table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .action-btn.delete:hover {
            background: #FEE2E2;
            color: #DC2626;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 32px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 600;
        }

        .modal-header button {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-header button:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-row-full {
            grid-column: 1 / -1;
        }

        /* PROFILE PICTURE UPLOAD */
        .profile-pic-container {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .profile-pic-upload {
            flex: 1;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .file-input-label:hover {
            background: var(--bg-tertiary);
        }

        .file-input-label svg {
            width: 16px;
            height: 16px;
        }

        .file-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* TAGS/PILLS */
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .tag-blue {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .tag-green {
            background: #DCFCE7;
            color: #166534;
        }

        .tag-orange {
            background: #FEF3C7;
            color: #92400E;
        }

        .tag-pink {
            background: #FCE7F3;
            color: #831843;
        }

        .tag-cyan {
            background: #CFFAFE;
            color: #164E63;
        }

        .tag-purple {
            background: #F3E8FF;
            color: #6B21A8;
        }

        .tag-red {
            background: #FEE2E2;
            color: #991B1B;
        }

        .tag-yellow {
            background: #FEF08A;
            color: #854D0E;
        }

        /* AVATAR */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        /* SCROLLABLE LIST */
        .scrollable-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item-info {
            flex: 1;
        }

        .list-item-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .list-item-position {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ALERTS */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-success {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #BBF7D0;
        }

        .alert-danger {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }

        .alert-warning {
            background: #FEF3C7;
            color: #92400E;
            border: 1px solid #FCD34D;
        }

        .alert svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .panel-grid {
                grid-template-columns: 1fr;
            }

            .stat-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 12px 0;
            }

            .sidebar-brand {
                padding: 12px;
                flex-direction: column;
            }

            .sidebar-brand h1 {
                font-size: 12px;
            }

            .sidebar-nav button {
                padding: 12px;
                justify-content: center;
                color: transparent;
            }

            .sidebar-nav button svg {
                width: 24px;
                height: 24px;
            }

            .main-content {
                margin-left: 70px;
            }

            .topbar {
                padding: 12px 16px;
            }

            .topbar-title {
                font-size: 18px;
            }

            .content-area {
                padding: 16px;
            }

            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }

            .modal {
                width: 95%;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-input {
                min-width: 100%;
            }

            .filter-group {
                width: 100%;
            }

            .filter-select {
                flex: 1;
            }

            .table {
                font-size: 12px;
            }

            .table th,
            .table td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // STATE MANAGEMENT
        class AppState {
            constructor() {
                this.user = null;
                this.token = null;
                this.currentSection = 'dashboard';
                this.employees = [];
                this.departments = [];
                this.positions = [];
                this.attendance = [];
                this.leaves = [];
                this.payroll = [];
                this.dashboardStats = null;
                this.filters = {
                    employees: {},
                    departments: {},
                    positions: {},

                if (token && user) {
                    this.token = token;
                    this.user = JSON.parse(user);
                    return true;
                }

                const options = {
                    method,

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`/api${endpoint}`, options);

                if (response.status === 401) {
                    appState.logout();
                    renderLogin();
                    return null;

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'API Error');

        function resizeAndConvertImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const maxSize = 200;
                    if (width > height) {
                        if (width > maxSize) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    callback(canvas.toDataURL('image/jpeg'));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                            </tr>

            `;

            if (filtered.length > 0) {
                filtered.forEach(att => {

                appState.filters.attendance.status = e.target.value;

                            <td><span class="tag tag-${statusColor}">${leave.status}</span></td>

            document.getElementById('addLeaveBtn').addEventListener('click', () => openLeaveModal());

            document.querySelectorAll('.edit-leave-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const leave = appState.leaves.find(l => l.id == id);
                    openLeaveModal(leave);
                });
            });

            document.querySelectorAll('.delete-leave-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');

                        try {
                            await api.deleteLeave(id);

        function renderPayroll() {
            const container = document.getElementById('payroll');
            const filtered = filterData(appState.payroll, appState.filters.payroll);

            let html = `
                <div class="toolbar">
                    <div class="search-input">
                        <input type="text" id="payrollSearch" placeholder="Search by employee name...">
                    </div>
                    <div class="filter-group">
                        <select id="payrollStatusFilter" class="filter-select">
                            <option value="">All Status</option>
                            <option value="draft">Draft</option>
                            <option value="processed">Processed</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                    <button class="btn btn-primary btn-sm" id="addPayrollBtn">${icons.plus} Generate Payroll</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Month</th>
                                <th>Basic Salary</th>
                                <th>Deductions</th>
                                <th>Net Salary</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (filtered.length > 0) {
                filtered.forEach(pay => {
                    const emp = appState.employees.find(e => e.id === pay.employee_id);
                    const statusColor = pay.status === 'paid' ? 'green' : pay.status === 'processed' ? 'blue' : 'yellow';
                    const netSalary = pay.basic_salary - pay.deductions;

                    html += `
                        <tr>
                            <td>${emp ? emp.name : 'Unknown'}</td>
                            <td>${pay.month}</td>
                            <td class="mono-font">$${(pay.basic_salary || 0).toLocaleString()}</td>
                            <td class="mono-font">$${(pay.deductions || 0).toLocaleString()}</td>
                            <td class="mono-font"><strong>$${(netSalary || 0).toLocaleString()}</strong></td>
                            <td><span class="tag tag-${statusColor}">${pay.status}</span></td>
                            <td>
                                <div class="table-actions">
                                    <button class="action-btn edit-pay-btn" data-id="${pay.id}">${icons.edit}</button>
                                    <button class="action-btn delete delete-pay-btn" data-id="${pay.id}">${icons.trash}</button>
                                </div>
                            </td>
                        </tr>
                    `;

            } else {
                html += '<tr><td colspan="7" class="empty-state">No payroll records found</td></tr>';
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

            document.getElementById('payrollSearch').addEventListener('input', (e) => {
                appState.filters.payroll.search = e.target.value;
                renderPayroll();
            });

            document.getElementById('payrollStatusFilter').addEventListener('change', (e) => {
                appState.filters.payroll.status = e.target.value;
                renderPayroll();
            });

            document.getElementById('addPayrollBtn').addEventListener('click', () => openPayrollModal());

            document.querySelectorAll('.edit-pay-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const pay = appState.payroll.find(p => p.id == id);
                    openPayrollModal(pay);
                });
            });

            document.querySelectorAll('.delete-pay-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('Delete this payroll record?')) {
                        try {
                            await api.deletePayroll(id);
                            appState.payroll = appState.payroll.filter(p => p.id != id);
                            renderPayroll();
                        } catch (error) {
                            alert('Error: ' + error.message);
                        }
                    }
                });
            });
        }

        function openPayrollModal(payroll = null) {
            const isEdit = !!payroll;
            const modalBody = document.getElementById('payrollModalBody');

            let html = `
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Employee</label>
                            <select id="payEmployee">
                                <option value="">Select Employee</option>
                                ${appState.employees.map(e => `<option value="${e.id}" ${payroll?.employee_id == e.id ? 'selected' : ''}>${e.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Month</label>
                            <input type="month" id="payMonth" value="${payroll?.month || ''}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Basic Salary</label>
                            <input type="number" id="payBasic" placeholder="0" value="${payroll?.basic_salary || ''}">
                        </div>
                        <div class="form-group">
                            <label>Deductions</label>
                            <input type="number" id="payDeductions" placeholder="0" value="${payroll?.deductions || ''}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status</label>
                            <select id="payStatus">
                                <option value="draft" ${payroll?.status === 'draft' ? 'selected' : ''}>Draft</option>
                                <option value="processed" ${payroll?.status === 'processed' ? 'selected' : ''}>Processed</option>
                                <option value="paid" ${payroll?.status === 'paid' ? 'selected' : ''}>Paid</option>
                            </select>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="payId" value="${payroll?.id || ''}">
            `;

            modalBody.innerHTML = html;

            // Auto-fetch employee salary
            document.getElementById('payEmployee').addEventListener('change', (e) => {
                const empId = e.target.value;
                const emp = appState.employees.find(e => e.id == empId);
                if (emp && emp.salary) {
                    document.getElementById('payBasic').value = emp.salary;
                }
            });

            document.getElementById('savePayrollBtn').onclick = async () => {
                const data = {
                    employee_id: document.getElementById('payEmployee').value,
                    month: document.getElementById('payMonth').value,
                    basic_salary: parseInt(document.getElementById('payBasic').value) || 0,
                    deductions: parseInt(document.getElementById('payDeductions').value) || 0,
                    status: document.getElementById('payStatus').value
                };

                try {
                    if (isEdit) {
                        const payId = document.getElementById('payId').value;
                        await api.updatePayroll(payId, data);
                        const index = appState.payroll.findIndex(p => p.id == payId);
                        appState.payroll[index] = { ...appState.payroll[index], ...data };
                    } else {
                        const result = await api.createPayroll(data);
                        appState.payroll.push(result);
                    }
                    closeModal('payrollModal');
                    renderPayroll();
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            };

            document.getElementById('payrollModal').classList.add('active');
        }

        // UTILITY FUNCTIONS
        function filterData(data, filters) {
            return data.filter(item => {
                if (filters.search) {
                    const searchTerm = filters.search.toLowerCase();
                    if (item.name && !item.name.toLowerCase().includes(searchTerm)) {
                        if (!item.email || !item.email.toLowerCase().includes(searchTerm)) {
                            if (!item.title || !item.title.toLowerCase().includes(searchTerm)) {
                                return false;
                            }
                        }
                    }
                }
                if (filters.status && item.status !== filters.status) return false;
                if (filters.department && item.department_id !== parseInt(filters.department)) return false;
                if (filters.date && item.date !== filters.date) return false;
                if (filters.type && item.type !== filters.type) return false;
                return true;
            });
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        });

        // INIT
        if (appState.loadFromStorage()) {
            renderApp();
        } else {
            renderLogin();
        }
    </script>
</body>
</html>
